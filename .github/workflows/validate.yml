name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No `ignore:` here, deliberately. Inclusion in the HACS default list
      # requires this action to pass with no errors *and* no ignores, so an
      # ignore that makes CI green would fail the submission instead.
      # The brands check is satisfied by custom_components/restart_guard/brand/
      # containing icon.png; it only falls back to the home-assistant/brands
      # repository when that directory is missing.
      - uses: hacs/action@main
        with:
          category: integration
